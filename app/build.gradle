// ktfmtCheck / ktfmtFormat run the ktfmt CLI directly (kotlinlang style), so
// the formatter version is pinned in the version catalog like everything else.
configurations {
    ktfmtCli
}

dependencies {
    ktfmtCli libs.ktfmt
}

def ktfmtTask(String name, String description, List<String> flags) {
    tasks.register(name, JavaExec) {
        group = 'formatting'
        setDescription(description)
        classpath = configurations.ktfmtCli
        mainClass = 'com.facebook.ktfmt.cli.Main'
        def sources = fileTree('src') { include '**/*.kt' }
        inputs.files(sources)
        def paths = sources.files.collect { it.path }.sort()
        args(['--kotlinlang-style'] + flags + paths)
    }
}

ktfmtTask('ktfmtCheck', 'Fails if any Kotlin source is not ktfmt-formatted.',
        ['--dry-run', '--set-exit-if-changed'])
ktfmtTask('ktfmtFormat', 'Formats all Kotlin sources with ktfmt.', [])

// signingProperties returns the keystore every build is signed with. Sources,
// first match wins:
//   1. SIMPLEXRAY_KEYSTORE + SIMPLEXRAY_KEYSTORE_PASSWORD (+ optional
//      SIMPLEXRAY_KEY_ALIAS, SIMPLEXRAY_KEY_PASSWORD) in the environment;
//   2. a properties file at $SIMPLEXRAY_SIGNING_PROPERTIES, else store.properties
//      in the repo root (git-ignored), else ~/.config/simplexray/signing.properties,
//      with keys storeFile, storePassword, keyAlias, keyPassword;
//   3. the public debug.keystore in the repo root.
// keyAlias defaults to "simplexray" and keyPassword to the store password.
def signingProperties() {
    def env = System.getenv()
    def result
    if (env.SIMPLEXRAY_KEYSTORE && env.SIMPLEXRAY_KEYSTORE_PASSWORD) {
        result = [
                storeFile    : env.SIMPLEXRAY_KEYSTORE,
                storePassword: env.SIMPLEXRAY_KEYSTORE_PASSWORD,
                keyAlias     : env.SIMPLEXRAY_KEY_ALIAS,
                keyPassword  : env.SIMPLEXRAY_KEY_PASSWORD,
        ]
    } else {
        def candidates = [
                env.SIMPLEXRAY_SIGNING_PROPERTIES,
                rootProject.file('store.properties').path,
                "${System.getProperty('user.home')}/.config/simplexray/signing.properties",
        ].findAll { it }
        def f = candidates.collect { new File(it) }.find { it.isFile() }
        if (f == null) {
            return [
                    storeFile    : rootProject.file('debug.keystore').path,
                    storePassword: 'android',
                    keyAlias     : 'androiddebugkey',
                    keyPassword  : 'android',
            ]
        }
        def props = new Properties()
        f.withInputStream { props.load(it) }
        if (!props.storeFile || !props.storePassword) {
            throw new GradleException("${f} must set storeFile and storePassword")
        }
        // A relative storeFile is relative to the properties file.
        def store = new File(props.storeFile)
        result = [
                storeFile    : store.absolute ? store.path : new File(f.absoluteFile.parentFile, props.storeFile).path,
                storePassword: props.storePassword,
                keyAlias     : props.keyAlias,
                keyPassword  : props.keyPassword,
        ]
    }
    result.keyAlias = result.keyAlias ?: 'simplexray'
    result.keyPassword = result.keyPassword ?: result.storePassword
    if (!new File(result.storeFile).isFile()) {
        throw new GradleException("Keystore not found at ${result.storeFile}")
    }
    return result
}
