android {
    namespace = 'com.simplexray.an'
    compileSdk = 37
    ndkVersion = versionProps.NDK_VERSION

    defaultConfig {
        applicationId = 'io.github.franticplant.simplexray'
        minSdk = 29
        targetSdk = 36
        versionCode = versionProps.APP_VERSION_CODE.toInteger()
        versionName = versionProps.APP_VERSION_NAME

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            ndkBuild {
                arguments "APP_CFLAGS+=-DPKGNAME=com/simplexray/an/service -ffile-prefix-map=${rootDir}=."
                arguments 'APP_LDFLAGS+=-Wl,--build-id=none'
            }
        }
    }

    // Signing. Credentials never live in the repo: CI passes them in the
    // environment (see .github/workflows/release.yml) and local builds read a
    // properties file. When a release key is configured, every build type is
    // signed with it, so a locally built debug APK installs over a released one
    // without losing app data. Without one, everything is signed with the
    // checked-in debug.keystore, which is public and only good for testing.
    def signing = signingProperties()
    signingConfigs {
        simplexray {
            storeFile = file(signing.storeFile)
            storePassword = signing.storePassword
            keyAlias = signing.keyAlias
            keyPassword = signing.keyPassword
            enableV1Signing = false
            enableV2Signing = false
            enableV3Signing = true
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // -Punsigned builds unsigned APKs, for scripts/verify-reproducible.sh.
        if (!project.hasProperty('unsigned')) {
            configureEach { signingConfig = signingConfigs.simplexray }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    externalNativeBuild {
        ndkBuild {
            path = file('src/main/jni/Android.mk')
        }
    }

    // Every lint warning fails the build. A true false positive is suppressed
    // where it occurs, with a comment saying why.
    lint {
        abortOnError = true
        warningsAsErrors = true
        checkReleaseBuilds = true
        // Dependabot owns version bumps.
        disable 'GradleDependency', 'NewerVersionAvailable', 'AndroidGradlePluginVersion'
    }

    packaging {
        jniLibs {
            // libxray.so is an executable started with ProcessBuilder, so it
            // has to be extracted to nativeLibraryDir.
            useLegacyPackaging = true
        }
    }

    // No dependency metadata blob (encrypted, unverifiable). The VCS info AGP
    // adds is just the commit hash, which a rebuild from the tag reproduces.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    // Per-ABI APKs plus a universal one, as published on GitHub releases.
    splits {
        abi {
            enable = true
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk = true
        }
    }

    testOptions {
        // android.util.Log and friends return defaults instead of throwing.
        unitTests.returnDefaultValues = true
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }
}

