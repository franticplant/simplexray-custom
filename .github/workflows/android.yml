name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    # all PRs on all branches
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  android:
    name: Check, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        id: setup

      - name: License headers
        run: scripts/check-license-headers.sh

      - name: Format check (ktfmt)
        run: ./gradlew ktfmtCheck

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # Fails on any finding not already recorded in app/lint-baseline.xml.
      - name: Lint
        run: ./gradlew lintDebug

      - name: Build debug APKs
        run: ./gradlew assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simplexray-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ github.sha }}
          path: app/build/reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        run: |
          {
            echo "### Debug build"
            echo "- Xray-core: \`${{ steps.setup.outputs.xray-version }}\`"
            (cd app/build/outputs/apk/debug && du -h *.apk | awk '{print "- `" $2 "`: " $1}')
          } >> "$GITHUB_STEP_SUMMARY"

  # Release-signed APKs of every push to main, so a CI build installs over the
  # released app. Pull requests (Dependabot's included) never reach this job,
  # and the "release" environment, which holds the signing secrets, should only
  # admit main and v* tags. Skipped quietly until a release key is configured.
  signed-apk:
    name: Build signed APKs
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: release
    steps:
      - name: Check for a release key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIMPLEXRAY_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::notice::SIMPLEXRAY_KEYSTORE_BASE64 is not set; skipping signed build. See .github/workflows/release.yml."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        if: steps.key.outputs.present == 'true'

      - name: Decode keystore
        if: steps.key.outputs.present == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.SIMPLEXRAY_KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/simplexray-release.jks"
          echo "SIMPLEXRAY_KEYSTORE=$RUNNER_TEMP/simplexray-release.jks" >> "$GITHUB_ENV"

      - name: Build release APKs
        if: steps.key.outputs.present == 'true'
        env:
          SIMPLEXRAY_KEYSTORE_PASSWORD: ${{ secrets.SIMPLEXRAY_KEYSTORE_PASSWORD }}
          SIMPLEXRAY_KEY_PASSWORD: ${{ secrets.SIMPLEXRAY_KEY_PASSWORD }}
          SIMPLEXRAY_KEY_ALIAS: ${{ vars.SIMPLEXRAY_KEY_ALIAS }}
        run: scripts/package-release.sh "main-${GITHUB_SHA::9}"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/simplexray-release.jks"

      - name: Verify signatures
        if: steps.key.outputs.present == 'true'
        env:
          EXPECTED: ${{ vars.SIMPLEXRAY_CERT_SHA256 }}
        run: scripts/verify-signatures.sh dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.key.outputs.present == 'true'
        with:
          name: simplexray-signed-${{ github.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
