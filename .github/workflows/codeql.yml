name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    # all PRs on all branches
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Kotlin can only be analyzed from a real compile.
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: ${{ matrix.language == 'java-kotlin' && 'recursive' || 'false' }}
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        if: matrix.language == 'java-kotlin'

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # CodeQL only sees what is compiled while it watches, so nothing may come
      # from the Gradle build cache or a daemon started before init.
      - name: Compile
        if: matrix.build-mode == 'manual'
        run: ./gradlew --no-daemon --no-build-cache --rerun-tasks compileDebugKotlin compileDebugJavaWithJavac

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
